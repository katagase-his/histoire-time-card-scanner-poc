<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
  <title>Histoire Time card｜QR読取</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/html5-qrcode.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app">
    <div class="brand">Histoire Time card</div>
    <section class="card">
      <div id="launch" class="launch">
        <h1>店舗QRを読み取る</h1>
        <p>カメラを起動して、店舗iPadの最新QRを読み取ってください。</p>
        <button id="start" class="start" type="button">カメラを起動</button>
      </div>
      <div id="reader" hidden></div>
      <button id="retry" type="button" hidden>カメラを再試行</button>
      <div id="error" class="error" role="alert"></div>
    </section>
  </main>
</body>
</html>
